name: Weekly Wayback archive

# data/supports.csv の全公式ページを週1回 Wayback Machine に保存する（変更検知時の保存の補完）。
# 直近6日以内に保存済みの URL はスキップ。日曜 3:10 JST（土曜 18:10 UTC）。

on:
  schedule:
    - cron: "10 18 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save pages to Wayback Machine
        run: python scripts/archive_pages.py --wait 20
        continue-on-error: true
      - name: Commit archive index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/archive-index.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "週次の Wayback 保存の結果を archive-index に記録する。"
            git pull --rebase origin main
            git push
          fi
