<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="brand"><a href="https://sites.google.com/view/civictechzenchiba/" target="_blank" rel="noopener">CivicTechZenChiba（CTZC）</a></div>
    <p class="meta" id="fetched">最終取得を読み込み中</p>
  </header>
  <main>

    </p>
    <div class="doors">
      <a class="door" href="resident/index.html">
        <strong>県民の方へ</strong>
        被害の経過と、いまの支援策を見る
      </a>
      <a class="door" href="supporters/index.html">
        <strong>支援・協働する方へ</strong>

  <footer>
    <p>有志運営 / 制度の適用可否は各実施機関の判断です。</p>
    <p class="org-links">
      <a href="https://sites.google.com/view/civictechzenchiba/" target="_blank" rel="noopener">CTZC ウェブサイト</a>
      <a href="https://www.facebook.com/groups/civictechzenchiba/" target="_blank" rel="noopener">Facebook グループ</a>

      <a href="https://github.com/office626/r808chibagouu">GitHub</a>
    </p>
  </footer>
  <script>
    fetch("data/collection.json")
      .then(function (r) { return r.json(); })
      .then(function (col) {
        document.getElementById("fetched").textContent =
          "最終取得: " + col.fetched_at.replace("T", " ").replace("+09:00", " JST");
      })
      .catch(function () {
        document.getElementById("fetched").textContent = "最終取得: 読み込み失敗";
      });
  </script>
